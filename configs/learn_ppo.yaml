algo: "ppo"
n_envs: 1
total_timesteps: 100000

policy:
  name: "MlpPolicy"
  kwargs:
    ortho_init: true
    share_features_extractor: false

learning_rate:
  init: 0.01
  final_scaling: 0.5

algo_kwargs:
  n_steps: 10000
  n_epochs: 2
  batch_size: 10000
  clip_range: 0.2
  ent_coef: 1e-4
  vf_coef: 0.05
  gamma: 1.0