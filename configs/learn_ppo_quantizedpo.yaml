algo: "ppo"  # Algo string maps to normal PPO, but policy changes to tabular
n_envs: 1
total_timesteps: 100000

policy:
  name: "QuantizedTabularPolicy"
  kwargs:
    grid_bins: 30
    action_logits_to_optimizer: true

learning_rate:
  init: 0.3  # 1e-2 * 30 bins
  final_scaling: 0.0

algo_kwargs:
  n_steps: 10000
  n_epochs: 2
  batch_size: 10000
  clip_range: 0.2
  ent_coef: 1e-4
  vf_coef: 0.05
  gamma: 1.0