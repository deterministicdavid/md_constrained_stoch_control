# learn_config.yaml
algo: "md_adv_rate_critic_tdl"
n_envs: 16
total_timesteps: 100000

policy:
  name: "QuantizedTabularQandVandVTgtPolicy"
  kwargs:
    grid_bins: 40
    dt: 0.1  # policy_dt (differs from env dt)
    action_logits_to_optimizer: false

# Schedules
learning_rate:
  init: 0.4  # e.g., 1e-2 * 40 grid_bins
  final_scaling: 0.5

md_lambda:
  use_schedule: true
  start_dt_factor: 1.0    # 1.0 / (1.0 * dt)
  end_dt_factor: 100.0    # 1.0 / (100.0 * dt)
  multiplier: 1.0         # Overall scaling

# Algorithm parameters (passed directly to __init__)
algo_kwargs:
  batch_size: 2048
  buffer_size: 262144     # e.g., 128 * batch_size
  learning_starts: 1600   # e.g., 100 * n_envs
  train_freq: 1
  gradient_steps: 8
  tau: 0.05
  ent_coef: 1e-24
  gamma: 1.0
  # seq_len: 2            # Add this if algo requires it!